<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rolling Couples - GBBY SOFT</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .studio {
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    p {
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: #22c55e;
      color: #0f172a;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1rem;
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      background: #4ade80;
      transform: scale(1.03);
    }
    .footer {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Rolling Couples</h1>
    <div class="studio">GBBY SOFT</div>
    <p>
      Pon a prueba tu memoria y rapidez visual. Une todas las parejas antes de que se agote el tiempo.
    </p>
    <a class="btn" href="https://google.com" target="_blank">
      Descargar en Google Play
    </a>
    <div class="footer">
      © 2026 GBBY SOFT · Todos los derechos reservados
    </div>
  </div>
</body>
</html>
