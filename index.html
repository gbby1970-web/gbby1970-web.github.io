<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rolling Couples - GBBY SOFT</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #38bdf8, #3b82f6, #64748b);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(30, 58, 138, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(15, 23, 42, 0.25);
    }
    .stars {
      color: #fde047;
      font-size: 1.5rem;
      letter-spacing: 6px;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: #ffffff;
    }
    .studio {
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #bae6fd;
      margin-bottom: 24px;
    }
    p {
      line-height: 1.6;
      color: #f1f5f9;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.45);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      background: #4ade80;
      transform: scale(1.03);
    }
    .contact {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #e0f2fe;
    }
    .contact a {
      color: #fde047;
      text-decoration: none;
      font-weight: 500;
    }
    .contact a:hover {
      text-decoration: underline;
    }
    .footer {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="stars">★ ★ ★</div>
    <h1>Rolling Couples</h1>
    <div class="studio">GBBY SOFT</div>
    <p>
      Pon a prueba tu memoria y rapidez visual. Une todas las parejas antes de que se agote el tiempo.
    </p>
    <a class="btn" href="https://google.com" target="_blank">
      Descargar en Google Play
    </a>
    <div class="contact">
      Contacto y soporte: <a href="mailto:gbby1970@gmail.com">tucorreo@ejemplo.com</a>
    </div>
    <div class="footer">
      © 2026 GBBY SOFT · Todos los derechos reservados
    </div>
  </div>
</body>
</html>
