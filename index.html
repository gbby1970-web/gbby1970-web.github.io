<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rolling Couples - GBBY SOFT</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Fondo azul profundo con toque gris pizarra */
      background: linear-gradient(135deg, #0f172a, #1e3a5f, #334155);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
    }
    .stars {
      color: #facc15;
      font-size: 1.4rem;
      letter-spacing: 6px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: #f8fafc;
    }
    .studio {
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    p {
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      /* Botón verde con brillo amarillo al pasar el ratón */
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      background: #4ade80;
      transform: scale(1.03);
    }
    .footer {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="stars">★ ★ ★</div>
    <h1>Rolling Couples</h1>
    <div class="studio">GBBY SOFT</div>
    <p>
      Pon a prueba tu memoria y rapidez visual. Une todas las parejas antes de que se agote el tiempo.
    </p>
    <a class="btn" href="https://google.com" target="_blank">
      Descargar en Google Play
    </a>
    <div class="footer">
      © 2026 GBBY SOFT · Todos los derechos reservados
    </div>
  </div>
</body>
</html>
